<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学术共进 · 团队建设 | AMBIC</title>
  <meta name="description" content="先进集成电路材料与类脑芯片课题组学术共进活动影像。">
  <link rel="stylesheet" href="culture.css">
  <link rel="stylesheet" href="academic-layout.css">
</head>
<body class="academic-gallery-page">
  <header>
    <a class="brand" href="../index.html#home" aria-label="AMBIC 首页">AMBIC</a>
    <a class="back" href="../index.html#news">← 返回团队建设</a>
  </header>

  <main>
    <section class="academic-copy" aria-labelledby="gallery-title">
      <p class="academic-copy__kicker">ACADEMIC EXCHANGE</p>
      <h1 id="gallery-title">学术共进</h1>
      <div class="academic-copy__rule" aria-hidden="true"></div>
      <h2>在讨论中发现问题，在交流中推进研究。</h2>
      <p>组会是课题组分享进展、梳理问题与碰撞想法的重要时刻。一次汇报、一次追问、一次讨论，往往都会让研究思路更加清晰，也让不同方向之间产生新的连接。</p>
      <p>这些照片拍摄于组会结束之后。镜头记录的不只是一次合影，也记录着大家共同讨论、相互启发、一起把问题向前推进的科研日常。</p>
      <p class="academic-copy__quote">共同思考 · 共同探索 · 共同成长</p>
    </section>

    <section class="academic-carousel" aria-label="学术共进活动照片">
      <div class="academic-carousel__viewport">
        <div class="academic-carousel__track">
          <figure class="academic-carousel__slide is-active">
            <img src="../assets/academic-group-20260912-01.jpg" alt="课题组成员组会结束后在中山大学材料学院合影" fetchpriority="high">
          </figure>
          <figure class="academic-carousel__slide">
            <img src="../assets/academic-group-20260912-02.jpg" alt="课题组成员组会结束后在中山大学材料学院比心合影" loading="lazy">
          </figure>
          <figure class="academic-carousel__slide">
            <img src="../assets/academic-gallery-06.jpg" alt="课题组成员在教学楼前合影" loading="lazy">
          </figure>
        </div>
        <button class="academic-carousel__arrow academic-carousel__arrow--prev" type="button" aria-label="上一张">&#8249;</button>
        <button class="academic-carousel__arrow academic-carousel__arrow--next" type="button" aria-label="下一张">&#8250;</button>
      </div>
      <div class="academic-carousel__dots" aria-label="选择照片"></div>
    </section>
  </main>

  <footer>
    <span>AMBIC LABORATORY</span>
    <span>SUN YAT-SEN UNIVERSITY</span>
  </footer>
  <script>
    (() => {
      const carousel = document.querySelector('.academic-carousel');
      const track = carousel.querySelector('.academic-carousel__track');
      const slides = [...carousel.querySelectorAll('.academic-carousel__slide')];
      const dots = carousel.querySelector('.academic-carousel__dots');
      let current = 0;
      let timer;

      if (slides.length <= 1) {
        carousel.querySelectorAll('.academic-carousel__arrow, .academic-carousel__dots')
          .forEach(control => control.hidden = true);
        return;
      }

      slides.forEach((_, index) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.setAttribute('aria-label', `查看第 ${index + 1} 张照片`);
        dot.addEventListener('click', () => show(index, true));
        dots.appendChild(dot);
      });

      const dotButtons = [...dots.children];
      function show(index, restart = false) {
        current = (index + slides.length) % slides.length;
        track.style.transform = `translate3d(-${current * 100}%,0,0)`;
        slides.forEach((slide, i) => slide.classList.toggle('is-active', i === current));
        dotButtons.forEach((dot, i) => dot.classList.toggle('is-active', i === current));
        if (restart) start();
      }
      function start() {
        clearInterval(timer);
        timer = setInterval(() => show(current + 1), 3000);
      }

      carousel.querySelector('.academic-carousel__arrow--prev').addEventListener('click', () => show(current - 1, true));
      carousel.querySelector('.academic-carousel__arrow--next').addEventListener('click', () => show(current + 1, true));
      carousel.addEventListener('mouseenter', () => clearInterval(timer));
      carousel.addEventListener('mouseleave', start);
      show(0);
      start();
    })();
  </script>
</body>
</html>
