name: Compact team culture text once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  compact-team-culture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact layout
        run: python scripts/compact_team_culture_text_once.py
      - name: Commit layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/main.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Compact team culture text to preserve carousel'
          git push
