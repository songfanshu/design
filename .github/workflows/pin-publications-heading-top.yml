name: Pin publications heading to top

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-publications-top:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move representative publications heading to top
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('css/style.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* Publications page top aligned */'
          if marker not in text:
              text += '''\n\n/* Publications page top aligned */\n#publications{padding-top:0!important}\n#publications .section-head{margin-top:0!important;padding-top:0!important}\n#publications .section-head h2{margin-top:0!important}\n@media(max-width:650px){#publications{padding-top:0!important}}\n'''
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css
          if ! git diff --cached --quiet; then
            git commit -m "Align representative publications to top"
            git push
          fi
