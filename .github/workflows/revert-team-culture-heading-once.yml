name: Revert team culture heading once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  revert-team-culture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore previous layout and remove heading
        run: |
          git show fc55b6f153907fecc94b1d3a1a99350bf82c3b20:js/main.js > js/main.js
          python - <<'PY'
          from pathlib import Path
          p=Path('js/main.js')
          s=p.read_text(encoding='utf-8')
          target='<h2>在共同成长中建立有温度的科研团队</h2>'
          if target not in s:
              raise SystemExit('Expected heading not found')
          p.write_text(s.replace(target,'',1),encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/main.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore previous team culture layout without heading'
          git push
