name: Remove avatar default white ring once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-ring:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove default white inset ring from team avatars
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('css/style.css')
          text = path.read_text(encoding='utf-8')
          old = '.roster-avatar{display:block;flex-shrink:0;width:94px;height:94px;padding:6px;border:2px solid #277450;border-radius:50%;background:#f5faf7;box-shadow:inset 0 0 0 3px white}'
          new = '.roster-avatar{display:block;flex-shrink:0;width:94px;height:94px;padding:6px;border:2px solid #277450;border-radius:50%;background:#f5faf7;box-shadow:none}'
          if old not in text:
              raise SystemExit('Target avatar base style not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css
          if ! git diff --cached --quiet; then
            git commit -m "Remove default avatar white ring"
            git push
          fi
