name: Enlarge top navigation font once

on:
  push:
    paths:
      - '.github/workflows/enlarge-top-nav-font-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enlarge desktop navigation font
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</head>'
          style = '<style id="nav-font-v2">@media(min-width:1051px){.main-nav a{font-size:16.5px!important;font-weight:600!important}}</style>'
          if 'id="nav-font-v2"' in s:
              raise SystemExit('nav-font-v2 already exists')
          if marker not in s:
              raise SystemExit('head marker not found')
          s = s.replace(marker, style + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/enlarge-top-nav-font-once.yml').unlink()
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Increase top navigation font size"
          git push
