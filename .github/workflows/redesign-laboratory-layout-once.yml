name: Redesign laboratory layout once

on:
  push:
    paths:
      - '.github/workflows/redesign-laboratory-layout-once.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redesign laboratory section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          new_style = r'''<style id="laboratory-styles">
/* Laboratory page: editorial research-platform layout. */
#laboratory{
  background:
    radial-gradient(circle at 88% 12%,rgba(7,91,57,.11),transparent 29%),
    radial-gradient(circle at 7% 88%,rgba(58,127,159,.09),transparent 30%),
    linear-gradient(135deg,#fbfdfc 0%,#f2f8f5 55%,#edf5f2 100%);
  padding-top:clamp(34px,5vh,58px);
  padding-bottom:56px;
}
#laboratory>*{max-width:1380px}
.lab-overview{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);gap:clamp(42px,6vw,92px);align-items:end;margin:0 auto 34px}
.lab-kicker{display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.14em;color:var(--green);font-weight:700;text-transform:uppercase}
.lab-kicker:before{content:"";width:36px;height:2px;background:var(--green)}
.lab-overview h2{font-size:clamp(38px,4.1vw,62px);line-height:1.08;margin:14px 0 18px;color:#17372d;letter-spacing:-.03em}
.lab-overview-copy p{max-width:720px;margin:0;font-size:17px;line-height:1.85;color:#52665d}
.lab-capabilities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lab-capability{min-height:92px;padding:18px 18px 16px;border:1px solid rgba(7,91,57,.12);border-radius:14px;background:rgba(255,255,255,.76);box-shadow:0 8px 24px rgba(24,55,46,.04);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.lab-capability span{display:block;font-size:12px;color:#70837a;margin-bottom:7px;letter-spacing:.08em}
.lab-capability strong{font-size:17px;color:#17372d;font-weight:700}
.equipment-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:0 auto}
.equipment-card{position:relative;min-width:0;display:grid;grid-template-columns:minmax(190px,.78fr) minmax(0,1.22fr);min-height:245px;background:rgba(255,255,255,.92);border:1px solid rgba(7,91,57,.12);border-radius:18px;overflow:hidden;box-shadow:0 14px 34px rgba(24,55,46,.055);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.equipment-card:hover{transform:translateY(-3px);border-color:rgba(7,91,57,.24);box-shadow:0 20px 44px rgba(24,55,46,.09)}
.equipment-media{position:relative;min-height:245px;padding:20px;background:linear-gradient(145deg,#e8f1ed 0%,#f4f8f6 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.equipment-media:before,.equipment-media:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(7,91,57,.1)}
.equipment-media:before{width:190px;height:190px;right:-70px;top:-76px}
.equipment-media:after{width:128px;height:128px;left:-54px;bottom:-56px}
.equipment-placeholder{position:relative;z-index:1;width:100%;height:100%;min-height:196px;border:1px solid rgba(7,91,57,.18);border-radius:12px;background:rgba(255,255,255,.52);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:7px;color:#61736a}
.equipment-placeholder:before{content:"";width:50px;height:50px;border:1.5px solid #6d9b87;border-radius:12px;background:linear-gradient(135deg,transparent 45%,rgba(7,91,57,.08) 46%,rgba(7,91,57,.08) 54%,transparent 55%)}
.equipment-photo-label{font-size:15px;color:#284f40;font-weight:700;letter-spacing:.06em}
.equipment-placeholder>span:last-child{font-size:12px;color:#809087}
.equipment-number{position:absolute;top:16px;left:18px;z-index:2;font-size:12px;letter-spacing:.12em;color:#3f6f5b;font-weight:700;background:rgba(255,255,255,.84);padding:4px 8px;border-radius:999px}
.equipment-copy{padding:24px 26px 22px;min-width:0;display:flex;flex-direction:column}
.equipment-category{font-size:12px;letter-spacing:.12em;color:var(--green);font-weight:700;margin-bottom:8px}
.equipment-copy h3{font-size:clamp(20px,1.45vw,24px);line-height:1.35;margin:0 0 14px;color:#17372d}
.equipment-summary{font-size:15px;line-height:1.7;color:#5b6d64;margin:0 0 18px}
.equipment-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:auto}
.equipment-meta div{padding-top:10px;border-top:1px solid #e4ebe7}
.equipment-meta span{display:block;font-size:11px;color:#89958f;margin-bottom:3px;letter-spacing:.05em}
.equipment-meta strong{display:block;font-size:14px;color:#3d5148;font-weight:600}
@media(max-width:1180px){.lab-overview{grid-template-columns:1fr;gap:24px}.lab-capabilities{grid-template-columns:repeat(4,minmax(0,1fr))}.equipment-card{grid-template-columns:1fr}.equipment-media{min-height:205px}.equipment-placeholder{min-height:165px}}
@media(max-width:860px){.lab-capabilities{grid-template-columns:repeat(2,minmax(0,1fr))}.equipment-grid{grid-template-columns:1fr}.equipment-card{grid-template-columns:minmax(180px,.7fr) minmax(0,1.3fr)}.equipment-media{min-height:230px}}
@media(max-width:620px){#laboratory{padding:28px 18px 44px}.lab-overview{margin-bottom:24px}.lab-overview h2{font-size:38px}.lab-overview-copy p{font-size:15px}.lab-capability{min-height:78px;padding:14px}.lab-capability strong{font-size:15px}.equipment-card{grid-template-columns:1fr}.equipment-media{min-height:190px}.equipment-copy{padding:20px}.equipment-meta{grid-template-columns:1fr 1fr}}
</style>'''

          new_section = r'''    <section class="laboratory section" id="laboratory" aria-labelledby="laboratory-title">
      <div class="lab-overview">
        <div class="lab-overview-copy">
          <div class="lab-kicker">实验平台 / Laboratory</div>
          <h2 id="laboratory-title">实验室</h2>
          <p>围绕材料制备、薄膜沉积、结构表征与光电测试构建实验平台，为新型半导体材料、忆阻器、光电探测器及神经形态器件研究提供完整的实验支撑。</p>
        </div>
        <div class="lab-capabilities" aria-label="实验平台能力">
          <div class="lab-capability"><span>01 / PREPARATION</span><strong>材料制备</strong></div>
          <div class="lab-capability"><span>02 / DEPOSITION</span><strong>薄膜沉积</strong></div>
          <div class="lab-capability"><span>03 / CHARACTERIZATION</span><strong>结构表征</strong></div>
          <div class="lab-capability"><span>04 / OPTOELECTRONICS</span><strong>光电测试</strong></div>
        </div>
      </div>

      <div class="equipment-grid">
        <article class="equipment-card">
          <div class="equipment-media"><div class="equipment-placeholder" role="img" aria-label="材料制备设备图片预留位置"><span class="equipment-photo-label">设备图片</span><span>实拍照片待补充</span></div><span class="equipment-number">01</span></div>
          <div class="equipment-copy"><span class="equipment-category">材料制备 / PREPARATION</span><h3>材料制备平台</h3><p class="equipment-summary">用于功能材料、量子点及器件前驱体系的制备与工艺探索，设备实拍与具体型号可在后续补充。</p><div class="equipment-meta"><div><span>设备名称</span><strong>待补充</strong></div><div><span>品牌 / 型号</span><strong>待补充</strong></div></div></div>
        </article>

        <article class="equipment-card">
          <div class="equipment-media"><div class="equipment-placeholder" role="img" aria-label="薄膜沉积设备图片预留位置"><span class="equipment-photo-label">设备图片</span><span>实拍照片待补充</span></div><span class="equipment-number">02</span></div>
          <div class="equipment-copy"><span class="equipment-category">薄膜沉积 / DEPOSITION</span><h3>薄膜沉积平台</h3><p class="equipment-summary">面向氧化物、金属及半导体功能薄膜的可控制备，为异质结构筑和器件集成提供工艺基础。</p><div class="equipment-meta"><div><span>设备名称</span><strong>待补充</strong></div><div><span>品牌 / 型号</span><strong>待补充</strong></div></div></div>
        </article>

        <article class="equipment-card">
          <div class="equipment-media"><div class="equipment-placeholder" role="img" aria-label="结构表征设备图片预留位置"><span class="equipment-photo-label">设备图片</span><span>实拍照片待补充</span></div><span class="equipment-number">03</span></div>
          <div class="equipment-copy"><span class="equipment-category">结构表征 / CHARACTERIZATION</span><h3>结构与材料表征</h3><p class="equipment-summary">围绕材料结构、表面形貌和关键物性开展表征，为材料优化、缺陷分析与界面机制研究提供依据。</p><div class="equipment-meta"><div><span>设备名称</span><strong>待补充</strong></div><div><span>品牌 / 型号</span><strong>待补充</strong></div></div></div>
        </article>

        <article class="equipment-card">
          <div class="equipment-media"><div class="equipment-placeholder" role="img" aria-label="光电测试设备图片预留位置"><span class="equipment-photo-label">设备图片</span><span>实拍照片待补充</span></div><span class="equipment-number">04</span></div>
          <div class="equipment-copy"><span class="equipment-category">光电测试 / OPTOELECTRONICS</span><h3>器件与光电测试</h3><p class="equipment-summary">用于器件电学、光响应与动态行为测试，支撑光电探测、人工突触及存算器件性能评估。</p><div class="equipment-meta"><div><span>设备名称</span><strong>待补充</strong></div><div><span>品牌 / 型号</span><strong>待补充</strong></div></div></div>
        </article>
      </div>
    </section>'''

          s2, n1 = re.subn(r'<style id="laboratory-styles">.*?</style>', new_style, s, count=1, flags=re.S)
          if n1 != 1:
              raise SystemExit(f'Could not replace laboratory style block: {n1}')

          pattern = r'    <section class="laboratory section" id="laboratory" aria-labelledby="laboratory-title">.*?</section>\n    <section class="visual section" id="visual">'
          replacement = new_section + '\n    <section class="visual section" id="visual">'
          s3, n2 = re.subn(pattern, replacement, s2, count=1, flags=re.S)
          if n2 != 1:
              raise SystemExit(f'Could not replace laboratory section: {n2}')

          p.write_text(s3, encoding='utf-8')
          PY
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign laboratory content layout"
          git push