name: Redesign laboratory layout once

on:
  push:
    paths:
      - '.github/workflows/redesign-laboratory-layout-once.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply laboratory redesign
        run: python scripts/redesign_lab_once.py
      - name: Commit laboratory redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign laboratory content layout"
          git push
