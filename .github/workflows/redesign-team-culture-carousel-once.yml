name: Redesign team culture carousel once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign-team-culture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply redesign
        run: python scripts/redesign_team_culture_carousel_once.py
      - name: Commit redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/main.js team-culture/academic.html team-culture/collaboration.html team-culture/community.html scripts/redesign_team_culture_carousel_once.py
          git add -u team-culture/growth.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Redesign team culture as three-slide carousel'
          git push
