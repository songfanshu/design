name: Bold research page text once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bold-research-text:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bold research page text
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('css/style.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* Research page typography: stronger weight */'
          block = '''\n\n/* Research page typography: stronger weight */\nbody.paged #research.research-papers .section-label{font-weight:700!important}\nbody.paged #research.research-papers h2{font-weight:800!important}\nbody.paged #research.research-papers .research-card h3{font-weight:700!important}\nbody.paged #research.research-papers .research-card p{font-weight:600!important}\nbody.paged #research.research-papers .paper-source{font-weight:600!important}\n'''
          if marker not in text:
              path.write_text(text.rstrip() + block, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/style.css
          git commit -m 'Bold research direction page text'
          git push
