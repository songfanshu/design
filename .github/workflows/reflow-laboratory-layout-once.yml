name: Reflow laboratory layout once

on:
  push:
    paths:
      - '.github/workflows/reflow-laboratory-layout-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert laboratory layout override
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</head>'
          style = '''<style id="laboratory-layout-v2">
/* Laboratory reflow: compact single-screen research-platform layout. */
#laboratory{padding:clamp(28px,4vh,44px) clamp(24px,4.8vw,76px) 44px!important;overflow-y:auto}
#laboratory>*{max-width:1460px!important;margin-left:auto;margin-right:auto}
#laboratory .lab-overview{display:block!important;margin:0 auto 24px!important}
#laboratory .lab-overview-copy{display:none!important}
#laboratory .lab-capabilities{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:14px!important}
#laboratory .lab-capability{min-height:82px!important;padding:16px 18px!important;border-radius:14px!important;display:flex!important;flex-direction:column!important;justify-content:center!important;position:relative!important;overflow:hidden!important;background:rgba(255,255,255,.86)!important;box-shadow:0 8px 24px rgba(24,55,46,.045)!important}
#laboratory .lab-capability:after{content:"";position:absolute;right:-24px;bottom:-34px;width:88px;height:88px;border:1px solid rgba(7,91,57,.09);border-radius:50%}
#laboratory .lab-capability span{font-size:11px!important;margin-bottom:5px!important;letter-spacing:.1em!important}
#laboratory .lab-capability strong{font-size:18px!important;line-height:1.25!important}
#laboratory .equipment-grid{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:16px!important;margin:0 auto!important;align-items:stretch!important}
#laboratory .equipment-card{display:flex!important;flex-direction:column!important;min-height:0!important;border-radius:16px!important;background:rgba(255,255,255,.94)!important;overflow:hidden!important;box-shadow:0 12px 30px rgba(24,55,46,.055)!important}
#laboratory .equipment-card:hover{transform:translateY(-4px)!important;box-shadow:0 18px 38px rgba(24,55,46,.095)!important}
#laboratory .equipment-media{min-height:0!important;height:clamp(150px,20vh,195px)!important;padding:15px!important;flex:0 0 auto!important}
#laboratory .equipment-placeholder{min-height:0!important;height:100%!important;border-style:solid!important;background:rgba(255,255,255,.58)!important}
#laboratory .equipment-placeholder:before{width:42px!important;height:42px!important;border-radius:10px!important}
#laboratory .equipment-number{top:13px!important;left:14px!important;font-size:11px!important}
#laboratory .equipment-copy{padding:18px 19px 18px!important;flex:1!important}
#laboratory .equipment-category{font-size:10.5px!important;margin-bottom:7px!important;letter-spacing:.09em!important}
#laboratory .equipment-copy h3{font-size:20px!important;margin:0 0 9px!important;line-height:1.3!important}
#laboratory .equipment-summary{font-size:13.5px!important;line-height:1.62!important;margin:0 0 14px!important}
#laboratory .equipment-meta{gap:8px!important}
#laboratory .equipment-meta div{padding-top:8px!important}
#laboratory .equipment-meta span{font-size:10px!important}
#laboratory .equipment-meta strong{font-size:13px!important}
@media(max-width:1180px){
  #laboratory .lab-capabilities{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #laboratory .equipment-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #laboratory .equipment-media{height:190px!important}
}
@media(max-width:650px){
  #laboratory{padding:24px 18px 36px!important}
  #laboratory .lab-capabilities{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;margin-bottom:20px!important}
  #laboratory .lab-capability{min-height:72px!important;padding:13px!important}
  #laboratory .lab-capability strong{font-size:16px!important}
  #laboratory .equipment-grid{grid-template-columns:1fr!important;gap:14px!important}
  #laboratory .equipment-card{display:grid!important;grid-template-columns:140px minmax(0,1fr)!important}
  #laboratory .equipment-media{height:auto!important;min-height:190px!important}
  #laboratory .equipment-copy{padding:16px!important}
  #laboratory .equipment-summary{font-size:13px!important}
}
</style>'''
          if 'id="laboratory-layout-v2"' in s:
              raise SystemExit('laboratory-layout-v2 already exists')
          if marker not in s:
              raise SystemExit('head marker not found')
          s = s.replace(marker, style + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit layout reflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reflow laboratory page layout"
          git push