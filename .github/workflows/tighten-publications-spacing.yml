name: Tighten publications spacing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-spacing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten representative publications spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('css/style.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* Publications title-to-list spacing: tightened */'
          if marker not in text:
              text += '''\n\n/* Publications title-to-list spacing: tightened */\n#publications .section-head{margin-bottom:16px}\n#publications .section-head h2{margin-bottom:6px}\n@media(max-width:650px){#publications .section-head{margin-bottom:12px}#publications .section-head h2{margin-bottom:4px}}\n'''
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css
          if ! git diff --cached --quiet; then
            git commit -m "Tighten publications title spacing"
            git push
          fi
