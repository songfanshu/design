name: Remove avatar white hover ring once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-avatar-hover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove white inset ring from team avatar hover and active states
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('css/style.css')
          text = path.read_text(encoding='utf-8')
          old_hover = "#team .roster-avatar:hover{transform:scale(1.08);border-color:#075b39;box-shadow:0 8px 20px rgba(7,91,57,.16),inset 0 0 0 3px white}"
          new_hover = "#team .roster-avatar:hover{transform:scale(1.08);border-color:#075b39;box-shadow:0 8px 20px rgba(7,91,57,.16)}"
          old_active = "#team .roster-avatar:active{transform:scale(1.34);z-index:30;border-color:#075b39;box-shadow:0 16px 34px rgba(7,91,57,.28),inset 0 0 0 3px white}"
          new_active = "#team .roster-avatar:active{transform:scale(1.34);z-index:30;border-color:#075b39;box-shadow:0 16px 34px rgba(7,91,57,.28)}"
          if old_hover not in text or old_active not in text:
              raise SystemExit('Expected avatar hover/active styles not found')
          text = text.replace(old_hover, new_hover, 1).replace(old_active, new_active, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css
          if ! git diff --cached --quiet; then
            git commit -m "Remove avatar white hover ring"
            git push
          fi
