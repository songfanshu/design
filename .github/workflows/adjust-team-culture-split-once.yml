name: Adjust team culture split layout once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  adjust-team-culture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply split layout
        run: python scripts/adjust_team_culture_split_once.py
      - name: Commit layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/main.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Keep team culture intro left and carousel right'
          git push
