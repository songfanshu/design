name: Remove about page once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-about:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove 07 group introduction page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          pattern = r'\s*<section class="intro section" id="about">.*?</section>(?=</main>)'
          updated, count = re.subn(pattern, '', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected to remove 1 about section, removed {count}')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Remove group introduction page"
            git push
          fi
