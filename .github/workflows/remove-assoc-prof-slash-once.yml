name: Remove associate professor slash once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-slash:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove slash after 副教授
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          new = text.replace('<h3>副教授 / </h3>', '<h3>副教授</h3>')
          if new == text:
              new = text.replace('副教授 / </h3>', '副教授</h3>')
          if new != text:
              path.write_text(new, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove slash after associate professor label'
          git push
